version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # macOS deployment floor; matches build/darwin/Info.plist LSMinimumSystemVersion.
  MACOS_MIN: '11.0'

tasks:
  build:
    summary: Builds the macOS GUI binary (CGO enabled, production tags)
    cmds:
      - task: build:native

  build:native:
    summary: Native cgo build on the macOS host
    internal: true
    deps:
      - task: common:generate:icons
    cmds:
      - go build -tags production -trimpath -buildvcs=false -ldflags="{{.GO_LDFLAGS}}" -o "{{.OUTPUT}}" ./cmd/server
    vars:
      DEFAULT_OUTPUT: '{{printf "%s/%s" .BIN_DIR .APP_NAME}}'
      OUTPUT: '{{.OUTPUT | default .DEFAULT_OUTPUT}}'
      GO_LDFLAGS: '{{.GO_LDFLAGS | default "-s -w"}}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      # CGO_FLAGS carries per-arch clang flags: cross-building the amd64
      # slice on an arm64 host passes "-arch x86_64 -mmacosx-version-min=...".
      CGO_CFLAGS: '{{.CGO_FLAGS | default (printf "-mmacosx-version-min=%s" .MACOS_MIN)}}'
      CGO_LDFLAGS: '{{.CGO_FLAGS | default (printf "-mmacosx-version-min=%s" .MACOS_MIN)}}'
      MACOSX_DEPLOYMENT_TARGET: '{{.MACOS_MIN}}'

  package:
    summary: Builds the host-arch GUI binary and bundles Torrent TV.app
    deps:
      - task: build
    cmds:
      - task: create:app:bundle

  package:existing:
    summary: Bundles the .app from the binary already in bin/ (no rebuild)
    cmds:
      - task: create:app:bundle

  create:app:bundle:
    summary: Assembles the .app bundle (icons.icns + Info.plist + binary, ad-hoc codesign)
    deps:
      - task: common:generate:icons
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.BUNDLE_NAME | default .APP_NAME}}.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.BUNDLE_NAME | default .APP_NAME}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.BUNDLE_NAME | default .APP_NAME}}.app/Contents/Resources"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.BUNDLE_NAME | default .APP_NAME}}.app/Contents/MacOS"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.BUNDLE_NAME | default .APP_NAME}}.app/Contents"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.BUNDLE_NAME | default .APP_NAME}}.app"
