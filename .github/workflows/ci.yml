name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go tests, vet, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      # Two wails3 Linux shapes need headers on the runner: the tagged
      # release GUI builds (production,gtk3 -> gtk3/webkit2gtk-4.1) and the
      # untagged default compiles `go test`/`go vet`/`go build` perform
      # (gtk4/webkitgtk-6.0). Install both sets.
      - name: Install WebKit/GTK dev packages (GUI cgo)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev
      # wails3 (v3.0.0-beta.16, matches go.mod github.com/wailsapp/wails/v3)
      # drives `make build` (icons + wails3 build task); Makefile WAILS3 var.
      # The CLI itself compiles its Linux desktop-probe package against
      # gtk4/webkitgtk-6.0 unless cgo is disabled; the CLI only drives builds
      # (the project's own cgo needs are met by the step above), so a
      # cgo-free CLI install keeps the runner requirement to the 4.1 set.
      - name: Install wails3
        run: CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
      - name: Unit tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build server
        run: go build ./cmd/server

  clients:
    name: Browser and Tizen clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Client unit tests
        run: npm run test:clients
      # Desktop GUI suite (vitest, @torrent-tv/desktop workspace).
      - name: Desktop unit tests
        run: npm run test -w @torrent-tv/desktop
      - name: Test and build browser and TV clients
        run: npm run build
      - name: Package and validate unsigned Apps2Samsung WGT
        run: make tizen-wgt validate-tizen-wgt
      - name: Validate the same WGT against the Tizen 5.0 support floor
        run: make validate-tizen-wgt TIZEN_TARGET=5.0
      - name: Headless old-engine boot smoke on the pinned Chrome 63 floor
        run: make smoke-tizen-engine
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tizen-wgt-ci
          path: clients/tizen/.build/artifacts/*.wgt
          if-no-files-found: error
          retention-days: 7

  tooling:
    name: Packaging and repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Packaging tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Repository whitespace checks
        run: git diff --check

  android-tv:
    name: TorrentTV Android shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Ensure Android SDK platform 35
        run: sdkmanager --install "platforms;android-35" >/dev/null 2>&1 || true
      - name: Install locked dependencies
        run: npm ci
      - name: Build the shared TV web app
        run: npm run build -w @torrent-tv/tv
      - name: Sync web app into the APK assets
        run: cd clients/android-tv && ./gradlew :app:syncWebApp
      - name: Same-bundle check (Parity contract rule 1)
        run: |
          cmp clients/tv/dist/app.js clients/android-tv/app/src/main/assets/www/app.js
          cmp clients/tv/dist/app.css clients/android-tv/app/src/main/assets/www/app.css
      - name: Unit tests
        run: cd clients/android-tv && ./gradlew :app:testDebugUnitTest
      - name: Build the APK
        run: cd clients/android-tv && ./gradlew :app:assembleDebug
      - name: Upload smoke-tested APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: torrenttv-apk-ci
          path: clients/android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  android-tv-smoke:
    name: ATV boot smoke (API ${{ matrix.api }})
    needs: android-tv
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The 2018 ATV floor and a current image: the same APK must boot
          # and answer the d-pad across the supported range. (API 33's TV
          # image no longer ships in the SDK repository.)
          - api: 26
            arch: x86
          - api: 34
            arch: x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: torrenttv-apk-ci
          path: clients/android-tv/app/build/outputs/apk/debug
      # The runner installs this again inside the emulator step with the
      # output discarded. ATV images are preview-licensed, which the hosted
      # runner image does not pre-accept, and a discarded sdkmanager prompt
      # is undiagnosable — accept licenses and install visibly first.
      - name: Accept SDK licenses and install the ATV system image (API ${{ matrix.api }})
        env:
          IMAGE: system-images;android-${{ matrix.api }};android-tv;${{ matrix.arch }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$IMAGE" > /dev/null
      - name: Boot smoke and d-pad probe
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: ${{ matrix.arch }}
          script: bash clients/android-tv/scripts/boot_smoke.sh
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: torrenttv-smoke-api${{ matrix.api }}
          path: |
            torrenttv-smoke.xml
            torrenttv-failure.png
            torrenttv-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
