name: Release build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clients:
    name: Client release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify declared versions
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test "$version" = "$(node -p "require('./clients/tv/package.json').version")"
          python3 - "$version" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          actual = ET.parse('clients/tizen/config.xml').getroot().attrib['version']
          if actual != sys.argv[1]:
              raise SystemExit(f'Tizen manifest version {actual} != VERSION {sys.argv[1]}')
          PY
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "v${version}"
          fi
      - run: npm ci
      - name: Test and build clients
        run: npm run build
      - name: Package and validate TV application
        run: make tizen-wgt validate-tizen-wgt
      - name: Validate the same WGT against the Tizen 5.0 support floor
        run: make validate-tizen-wgt TIZEN_TARGET=5.0
      - name: Set up JDK 17 for the TorrentTV shell
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Ensure Android SDK platform 35
        run: sdkmanager --install "platforms;android-35" >/dev/null 2>&1 || true
      - name: Package TorrentTV APK
        run: make torrenttv-apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-torrenttv
          path: clients/android-tv/.build/artifacts/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-static
          path: internal/adapters/httpapi/static/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-tizen
          path: clients/tizen/.build/artifacts/*.wgt
          if-no-files-found: error
          retention-days: 14

  servers:
    name: Server ${{ matrix.target }}
    needs: clients
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GUI cross-builds: verbatim wails-cross docker invocation from
          # the Makefile (build-arm64 / build-all linux lines,
          # build/docker/Dockerfile.cross, -tags production,gtk3).
          - target: linux-amd64-desktop
            goos: linux
            goarch: amd64
            suffix: ''
            format: tar
            runner: ubuntu-latest
            method: docker-cross
          - target: linux-arm64-desktop
            goos: linux
            goarch: arm64
            suffix: ''
            format: tar
            runner: ubuntu-latest
            method: docker-cross
          # Pure headless (Makefile build-all last line): CGO_ENABLED=0,
          # internal/gui compiles to the ErrNoDisplay fallback via build tags.
          - target: linux-armv7-headless
            goos: linux
            goarch: arm
            goarm: '7'
            suffix: ''
            format: tar
            runner: ubuntu-latest
            method: pure
          # Headless arm64/amd64 (Makefile build-arm64-headless /
          # build-amd64-headless): CGO_ENABLED=0 plus -tags headless so
          # internal/gui compiles to the ErrNoDisplay fallback on 64-bit
          # arches too. Version ldflags match the armv7 pure build.
          - target: linux-arm64-headless
            goos: linux
            goarch: arm64
            suffix: ''
            format: tar
            runner: ubuntu-latest
            method: pure
            go_tags: headless
          - target: linux-amd64-headless
            goos: linux
            goarch: amd64
            suffix: ''
            format: tar
            runner: ubuntu-latest
            method: pure
            go_tags: headless
          # Windows: cgo-free on the ubuntu runner (CGO_ENABLED=0 in
          # build/windows/Taskfile.yml); icon/version .syso + -H windowsgui
          # come from the windows:build task (Makefile build-all windows lines).
          - target: windows-amd64-desktop
            goos: windows
            goarch: amd64
            suffix: .exe
            format: zip
            runner: ubuntu-latest
            method: windows
          - target: windows-arm64-desktop
            goos: windows
            goarch: arm64
            suffix: .exe
            format: zip
            runner: ubuntu-latest
            method: windows
          # macOS: native cgo builds on the macOS runner (wails3 task
          # darwin:build; Makefile build-all darwin lines). The amd64 slice
          # cross-compiles via clang -arch x86_64 (CGO_FLAGS in
          # build/darwin/Taskfile.yml).
          - target: macos-amd64-cli
            goos: darwin
            goarch: amd64
            suffix: ''
            format: tar
            runner: macos-latest
            method: darwin-native
            cgo_flags: -arch x86_64 -mmacosx-version-min=11.0
          - target: macos-arm64-cli
            goos: darwin
            goarch: arm64
            suffix: ''
            format: tar
            runner: macos-latest
            method: darwin-native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-static
          path: internal/adapters/httpapi/static
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      # wails3 (v3.0.0-beta.16, matches go.mod) drives the windows/darwin
      # task builds and the linux docker-mounts; Makefile WAILS3 var.
      - name: Install wails3
        if: matrix.method != 'pure'
        run: CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
      # QEMU/binfmt for the arm64 wails-cross image on the amd64 ubuntu runner
      # (the Makefile ran these on an arm64 host; CI hosts are amd64).
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        if: matrix.method == 'docker-cross' && matrix.goarch == 'arm64'
      # Desktop GUI assets -> internal/gui/static, embedded into every GUI
      # binary (Makefile desktop-assets prerequisite of build/build-all).
      - name: Build desktop GUI assets (make desktop-assets)
        if: matrix.method == 'windows' || matrix.method == 'docker-cross'
        run: make desktop-assets
      # GitHub macOS runners have no Docker, so build the desktop GUI assets
      # directly with the same npm script the dockerized desktop-assets target
      # runs (npm run build:desktop -> internal/gui/static).
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: matrix.method == 'darwin-native'
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build desktop GUI assets (npm run build:desktop)
        if: matrix.method == 'darwin-native'
        run: |
          npm ci
          npm run build:desktop
      # wails-cross image (make wails-cross: `wails3 task setup:docker` plus,
      # for the amd64 slice, the `wails-cross:amd64` variant image). On this
      # amd64 CI host the arm64 image is built (and later run) under emulation
      # with --platform linux/arm64 — same shape as the Makefile's own
      # `--platform linux/amd64` line for the amd64 image on arm64 hosts.
      - name: Build wails-cross image (make wails-cross)
        if: matrix.method == 'docker-cross'
        run: |
          if [[ "${{ matrix.goarch }}" == "arm64" ]]; then
            docker build --platform linux/arm64 -t wails-cross -f build/docker/Dockerfile.cross build/docker/
          else
            wails3 task setup:docker
            docker build --platform linux/amd64 -t wails-cross:amd64 -f build/docker/Dockerfile.cross build/docker/
          fi
      # Windows: verbatim `wails3 task windows:build` from the Makefile
      # build-all windows lines. The task (build/windows/Taskfile.yml) is
      # cgo-free (CGO_ENABLED=0) and adds the icon/version .syso plus the
      # -H windowsgui linker flag.
      - name: Build ${{ matrix.target }} (wails3 task windows:build)
        if: matrix.method == 'windows'
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          mkdir -p staging
          wails3 task windows:build ARCH=${{ matrix.goarch }} OUTPUT="staging/torrent-tv${{ matrix.suffix }}" GO_LDFLAGS="-s -w -X github.com/mihaiflorentin88/torrent-tv/internal/composition.Version=${version}"
      # macOS: verbatim `wails3 task darwin:build` from the Makefile build-all
      # darwin lines; the amd64 slice cross-compiles via CGO_FLAGS
      # (-arch x86_64 -mmacosx-version-min=11.0, build/darwin/Taskfile.yml).
      - name: Build ${{ matrix.target }} (wails3 task darwin:build)
        if: matrix.method == 'darwin-native'
        env:
          CGO_FLAGS_X: ${{ matrix.cgo_flags }}
          CC: /usr/bin/clang
        run: |
          clang --version | head -1
          version="$(tr -d '[:space:]' < VERSION)"
          mkdir -p staging
          args=(darwin:build "ARCH=${{ matrix.goarch }}" "OUTPUT=staging/torrent-tv" "GO_LDFLAGS=-s -w -X github.com/mihaiflorentin88/torrent-tv/internal/composition.Version=${version}")
          if [[ -n "${CGO_FLAGS_X}" ]]; then args+=("CGO_FLAGS=${CGO_FLAGS_X}"); fi
          wails3 task "${args[@]}"
      # Linux GUI: verbatim docker invocation from the Makefile build-arm64 /
      # build-all linux lines (wails-cross image, -tags production,gtk3,
      # native gcc against gtk3/webkit2gtk-4.1 inside the container). The
      # amd64 slice uses the wails-cross:amd64 image with --platform
      # linux/amd64 exactly as in build-all.
      - name: Build ${{ matrix.target }} (wails-cross docker)
        if: matrix.method == 'docker-cross'
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          mkdir -p staging
          # docker-mounts quotes each path; CI paths carry no spaces, so the
          # embedded quotes would reach docker as part of the volume spec.
          mounts_raw=$(wails3 tool docker-mounts | tr -d '"')
          read -ra mounts <<<"$mounts_raw"
          docker_opts=(--rm)
          image='wails-cross'
          if [[ "${{ matrix.goarch }}" == "amd64" ]]; then
            docker_opts+=(--platform linux/amd64)
            image='wails-cross:amd64'
          elif [[ "${{ matrix.goarch }}" == "arm64" ]]; then
            docker_opts+=(--platform linux/arm64)
          fi
          docker run "${docker_opts[@]}" -v "$(pwd):/app" -w /app "${mounts[@]}" \
            -v "filelist-go-build-linux-${{ matrix.goarch }}:/root/.cache/go-build" \
            -e CGO_ENABLED=1 -e GOOS=linux -e "GOARCH=${{ matrix.goarch }}" -e CC=gcc \
            --entrypoint go "${image}" build \
            -tags production,gtk3 -trimpath -buildvcs=false \
            -ldflags="-s -w -X github.com/mihaiflorentin88/torrent-tv/internal/composition.Version=${version}" \
            -o staging/torrent-tv ./cmd/server
      # Pure headless (Makefile build-all last line plus
      # build-arm64-headless / build-amd64-headless): CGO_ENABLED=0 go build,
      # no GUI toolchain. Flavor identity: -tags headless when the matrix
      # entry declares it; version identity: composition.Version ldflags.
      - name: Build ${{ matrix.target }} (pure CGO_ENABLED=0)
        if: matrix.method == 'pure'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
          GO_TAGS: ${{ matrix.go_tags }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          mkdir -p staging
          args=(build -trimpath)
          if [[ -n "${GO_TAGS}" ]]; then args+=(-tags "${GO_TAGS}"); fi
          args+=(-ldflags="-s -w -X github.com/mihaiflorentin88/torrent-tv/internal/composition.Version=${version}")
          args+=(-o "staging/torrent-tv${{ matrix.suffix }}" ./cmd/server)
          go "${args[@]}"
      - name: Stage release files
        run: cp README.md staging/
      - name: Create archive
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          ARCHIVE_FORMAT: ${{ matrix.format }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          base="torrent-tv-${version}-${RELEASE_TARGET}"
          if [[ "${ARCHIVE_FORMAT}" == "zip" ]]; then
            (cd staging && zip -9 "../${base}.zip" ./*)
          else
            tar -C staging -czf "${base}.tar.gz" .
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: torrent-tv-*
          if-no-files-found: error
          retention-days: 14

  # Universal macOS .app: merges the two darwin slices with lipo and bundles
  # them via wails3 (make build-all darwin lines + make package-darwin's
  # universal branch: lipo + `wails3 task darwin:package:existing`), then
  # guards the bundle metadata against VERSION.
  darwin-app:
    name: Universal macOS .app bundle
    needs: servers
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install wails3
        run: CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-macos-arm64-cli
          path: release-arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-macos-amd64-cli
          path: release-amd64
      - name: Merge slices with lipo and package universal .app (make package-darwin)
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          mkdir -p bin slice-arm64 slice-amd64
          tar -xzf "release-arm64/torrent-tv-${version}-macos-arm64-cli.tar.gz" -C slice-arm64
          tar -xzf "release-amd64/torrent-tv-${version}-macos-amd64-cli.tar.gz" -C slice-amd64
          lipo -create -output bin/torrent-tv \
            slice-arm64/torrent-tv slice-amd64/torrent-tv
          GOCACHE="$(go env GOCACHE)" wails3 task darwin:package:existing BUNDLE_NAME="Torrent TV"
      # Version guard: the bundle/plist and the windows info.json must carry
      # the release VERSION, else fail the job (no silently stale metadata).
      - name: Verify bundle versions match VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          plist="bin/Torrent TV.app/Contents/Info.plist"
          test "$version" = "$(plutil -extract CFBundleVersion raw "$plist")"
          test "$version" = "$(plutil -extract CFBundleShortVersionString raw "$plist")"
          test "$version" = "$(jq -r '.fixed.file_version' build/windows/info.json)"
      - name: Zip .app bundle (ditto preserves the ad-hoc signature)
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          ditto -c -k --keepParent "bin/Torrent TV.app" "torrent-tv-${version}-macos-universal-app.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-universal-app
          path: torrent-tv-*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [clients, servers, darwin-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the GitHub release and upload its assets.
      id-token: write # Request the OIDC identity used for provenance.
      attestations: write # Persist build provenance attestations.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Generate CycloneDX SBOMs
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0
          cyclonedx-gomod app -json -licenses -main cmd/server -output release/sbom-go.cdx.json .
          npm ci
          npm exec --yes --package=@cyclonedx/cyclonedx-npm@4.1.1 -- cyclonedx-npm --output-file release/sbom-npm.cdx.json --output-format JSON --omit dev
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release
          format: spdx-json
          output-file: release/sbom-release.spdx.json
          upload-artifact: false
      # SHA256SUMS covers exactly this run's payload: assert every required
      # archive exists, drop anything else (stale prior-run artifacts must
      # never enter the manifest), then checksum the payload minus the
      # manifest itself.
      - name: Checksums
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          cd release
          payload=(
            "torrent-tv-${version}-linux-amd64-desktop.tar.gz"
            "torrent-tv-${version}-linux-arm64-desktop.tar.gz"
            "torrent-tv-${version}-linux-amd64-headless.tar.gz"
            "torrent-tv-${version}-linux-arm64-headless.tar.gz"
            "torrent-tv-${version}-linux-armv7-headless.tar.gz"
            "torrent-tv-${version}-windows-amd64-desktop.zip"
            "torrent-tv-${version}-windows-arm64-desktop.zip"
            "torrent-tv-${version}-macos-amd64-cli.tar.gz"
            "torrent-tv-${version}-macos-arm64-cli.tar.gz"
            "torrent-tv-${version}-macos-universal-app.zip"
            "torrent-tv-${version}-samsung-tizen.wgt"
            "torrent-tv-${version}-android-tv.apk"
            "torrent-tv-${version}-android-tv.apk.sha256"
            sbom-go.cdx.json
            sbom-npm.cdx.json
            sbom-release.spdx.json
          )
          for f in "${payload[@]}"; do
            test -s "$f" || { echo "missing release asset: $f" >&2; exit 1; }
          done
          for f in ./*; do
            case " ${payload[*]} " in *" ${f#./} "*) ;; *) rm -f "$f" ;; esac
          done
          sha256sum "${payload[@]}" > SHA256SUMS
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --generate-notes --title "Torrent TV ${GITHUB_REF_NAME}"

  notify-update-feed:
    name: Synchronize update feed
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Notify completed release
        env:
          RELEASE_SYNC_TOKEN: ${{ secrets.FL_ADS_APIKEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/notify-release.mjs
